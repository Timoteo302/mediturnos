spring.application.name=mediturnos-api
server.port=8080

# Conexión a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/mediturnos?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true

#Cambiar user y pw!!!!!!!
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate (none para respetar mediturnos.sql tal cual está)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recuperación de contraseña (modo demostración)
mediturnos.recuperacion.modo-demostracion=true