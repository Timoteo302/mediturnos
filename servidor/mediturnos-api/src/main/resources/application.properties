# Importación opcional de configuración local (no subida al repositorio git)
spring.config.import=optional:classpath:application-local.properties

spring.application.name=mediturnos-api
server.port=8080

# Conexión a MySQL local (valores por defecto para desarrollo)
spring.datasource.url=jdbc:mysql://localhost:3306/mediturnos?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root

# JPA / Hibernate (none para respetar mediturnos.sql tal cual está)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recuperación de contraseña, proveedor de correo, push y URL pública
mediturnos.recuperacion.modo-demostracion=true
mediturnos.correo.proveedor=demostracion
mediturnos.correo.azure.cadena-conexion=
mediturnos.correo.remitente=
mediturnos.push.proveedor=demostracion
mediturnos.push.azure.cadena-conexion=
mediturnos.push.azure.nombre-hub=mediturnos-hub
mediturnos.url-publica=http://localhost:8080

# Configuración de JWT (el secreto va en application-local.properties o en Azure)
mediturnos.jwt.secreto=
mediturnos.jwt.duracion-horas=168

mediturnos.recordatorios.habilitados=true

# ===================================================================
# Variables de entorno para despliegue en Azure App Service:
# -------------------------------------------------------------------
# SPRING_DATASOURCE_URL                 -> Reemplaza spring.datasource.url
# SPRING_DATASOURCE_USERNAME            -> Reemplaza spring.datasource.username
# SPRING_DATASOURCE_PASSWORD            -> Reemplaza spring.datasource.password
# SERVER_PORT=80                        -> Reemplaza server.port=8080
# SPRING_JPA_SHOW_SQL=false             -> Reemplaza spring.jpa.show-sql=true
# MEDITURNOS_RECUPERACION_MODODEMOSTRACION -> Reemplaza mediturnos.recuperacion.modo-demostracion
# MEDITURNOS_CORREO_PROVEEDOR           -> Reemplaza mediturnos.correo.proveedor
# MEDITURNOS_CORREO_AZURE_CADENACONEXION -> Reemplaza mediturnos.correo.azure.cadena-conexion
# MEDITURNOS_CORREO_REMITENTE           -> Reemplaza mediturnos.correo.remitente
# MEDITURNOS_PUSH_PROVEEDOR             -> Reemplaza mediturnos.push.proveedor
# MEDITURNOS_PUSH_AZURE_CADENACONEXION  -> Reemplaza mediturnos.push.azure.cadena-conexion
# MEDITURNOS_PUSH_AZURE_NOMBREHUB       -> Reemplaza mediturnos.push.azure.nombre-hub
# MEDITURNOS_URLPUBLICA                 -> Reemplaza mediturnos.url-publica
# MEDITURNOS_JWT_SECRETO                -> Reemplaza mediturnos.jwt.secreto
# MEDITURNOS_RECORDATORIOS_HABILITADOS  -> Reemplaza mediturnos.recordatorios.habilitados
# ===================================================================